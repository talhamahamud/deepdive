<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading… — DeepDive</title>
  <meta name="description" content="" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../style.css" />
  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
</head>
<body>

<!-- ═══ HEADER ═══════════════════════════════════════════════ -->
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="site-logo" id="logo-link">
      <div class="logo-icon">D</div>
      <span class="logo-name">DeepDive</span>
    </a>
    <div class="search-wrap" id="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" id="search-input" placeholder="Search posts…" autocomplete="off" />
      <div class="search-results" id="search-results" role="listbox" aria-label="Search results"></div>
    </div>
  </div>
</header>

<!-- ═══ BREADCRUMB ════════════════════════════════════════════ -->
<div class="post-nav" id="post-nav">
  <a href="../index.html" id="nav-home">Home</a>
  <span class="post-nav-sep">›</span>
  <span id="nav-topic">…</span>
  <span class="post-nav-sep">›</span>
  <span id="nav-title">…</span>
</div>

<!-- ═══ MAIN ══════════════════════════════════════════════════ -->
<main>
  <div class="page-layout">

    <!-- Left: post content -->
    <div class="post-container page-content" id="post-container">

      <div class="loading" id="loading-indicator">
        <div class="spinner"></div>
        <span>Loading post…</span>
      </div>

      <!-- Populated by JS -->
      <div id="post-content" style="display:none;">
        <header class="post-header">
          <div class="post-topic-badge" id="post-badge">
            <span id="badge-topic"></span>
          </div>
          <h1 class="post-title" id="post-title"></h1>
          <div class="post-byline">
            <span class="post-author">Talha Mahamud</span>
            <span id="post-date"></span>
            <span id="post-read-time"></span>
          </div>
        </header>

        <hr class="post-divider" />

        <article class="prose" id="prose-body"></article>

        <nav class="post-footer-nav">
          <a href="../index.html" class="back-home-btn">
            ← Back to all posts
          </a>
        </nav>
      </div>

    </div>

    <!-- Right: heading TOC sidebar -->
    <aside class="toc-sidebar" id="toc-sidebar" aria-label="Table of contents">
      <div class="toc-label">On this page</div>
      <nav class="toc-nav" id="toc-nav"></nav>
    </aside>

  </div><!-- /.page-layout -->
</main>

<!-- ═══ FOOTER ════════════════════════════════════════════════ -->
<footer class="site-footer">
  <span>© <span id="footer-year"></span> All rights reserved · <a href="https://talhamahamud.github.io/portfolio/" class="footer-link">Talha Mahamud</a></span>
</footer>

<!-- marked.js for markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<!-- KaTeX and marked-katex-extension -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>
<script src="../post.js"></script>
</body>
</html>
